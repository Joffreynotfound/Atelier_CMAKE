name: Automatisation des tests
on: push

jobs:
  Compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilation
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
          make test

  Tests:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      - name: Run test "add" and capture report
        run: |
          cd build
          echo "== Test add 2 3 ==" > report_add.txt
          set +e
          ./src/calculator add 2 3 | tee -a report_add.txt
          status=${PIPESTATUS[0]}
          echo "Exit code: $status" >> report_add.txt
          exit $status

      - name: Run test "sub" and capture report
        if: always()
        run: |
          cd build
          echo "== Test sub 3 -2 ==" > report_sub.txt
          set +e
          ./src/calculator sub 3 -2 | tee -a report_sub.txt
          status=${PIPESTATUS[0]}
          echo "Exit code: $status" >> report_sub.txt
          exit $status

      - name: Run test "mul" and capture report
        if: always()
        run: |
          cd build
          echo "== Test mul 5 5 ==" > report_mul.txt
          set +e
          ./src/calculator mul 5 5 | tee -a report_mul.txt
          status=${PIPESTATUS[0]}
          echo "Exit code: $status" >> report_mul.txt
          exit $status

      - name: Run test "div" and capture report
        if: always()
        run:
