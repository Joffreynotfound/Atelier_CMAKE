name: Automatisation des tests
on: push

jobs:
  Compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilation
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
          make test

  Tests:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      - name: Run test "add" and capture report
        run: |
          cd build
          echo "== Test add 10 5 ==" > report.txt
          set +e
          ./src/calculator add 10 5 | tee -a report.txt
          status=${PIPESTATUS[0]}
          echo "Exit code: $status" >> report.txt
          exit $status

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-add-report
          path: build/report.txt
          retention-days: 14

      - name: Run test "sub" and capture report
        if: always()
        run: |
          cd build
          echo "== Test sub 10 5 ==" > report_sub.txt
          set +e
          ./src/calculator sub 10 5 | tee -a report_sub.txt
          status=${PIPESTATUS[0]}
          echo "Exit code: $status" >> report_sub.txt
          exit $status

      - name: Upload report "sub"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-sub-report
          path: build/report_sub.txt
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## Résultats des tests" >> $GITHUB_STEP_SUMMARY
          for f in build/report_*.txt; do
            name=$(basename "$f" .txt)
            name=${name#report_}
            echo "### Test *$name*" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
